plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    forgeRuntimeLibrary(include("org.pkl-lang:pkl-core:$rootProject.pkl_version"))
    forgeRuntimeLibrary(include("org.pkl-lang:pkl-parser:$rootProject.pkl_version"))
    forgeRuntimeLibrary(include("org.graalvm.polyglot:polyglot:$rootProject.graalvm_sdk_version"))
    forgeRuntimeLibrary(include("org.graalvm.sdk:collections:$rootProject.graalvm_sdk_version"))
    forgeRuntimeLibrary(include("org.graalvm.sdk:graal-sdk:$rootProject.graalvm_sdk_version"))
    forgeRuntimeLibrary(include("org.graalvm.sdk:nativeimage:$rootProject.graalvm_sdk_version"))
    forgeRuntimeLibrary(include("org.graalvm.sdk:word:$rootProject.graalvm_sdk_version"))
    forgeRuntimeLibrary(include("org.graalvm.truffle:truffle-api:$rootProject.graalvm_sdk_version"))
    forgeRuntimeLibrary(include("org.organicdesign:Paguro:$rootProject.paguro_version"))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
